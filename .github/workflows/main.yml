name: Social Radar Collector

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python3 collector/collector.py

      - name: Run Charles Insights
        env:
          ANTHROPIC_API_KEY_CHARLES_INSIGHTS: ${{ secrets.ANTHROPIC_API_KEY_CHARLES_INSIGHTS }}
        run: python3 insights.py

      - name: Commit and push
        run: |
          git config user.name "Charles Bot"
          git config user.email "charles@charlapodcast.com"
          git add data/metrics.json data/insights.json
          git diff --staged --quiet || git commit -m "data: update $(date +'%Y-%m-%d')"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
