name: Social Radar Collector

on:
  schedule:
    - cron: '0 10 * * *'      # Todo dia às 7h BRT (10h UTC)
  workflow_dispatch:
    inputs:
      full:
        description: 'Coleta completa (até 2.000 posts do Instagram, ~15-20 min) em vez da rápida de sempre'
        required: false
        default: false
        type: boolean

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID }}
          YOUTUBE_API_KEY:        ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:     ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID:      ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:  ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:  ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "Rodando coleta COMPLETA (--full)..."
            python3 collector/collector.py --full
          else
            python3 collector/collector.py
          fi

      - name: Run Charles Insights
        env:
          ANTHROPIC_API_KEY_CHARLES_INSIGHTS: ${{ secrets.ANTHROPIC_API_KEY_CHARLES_INSIGHTS }}
        run: python3 insights.py

      - name: Run Weekly Report (only on Mondays)
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 10') && format('{0}', github.event.repository.updated_at) != '' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY_CHARLES_INSIGHTS: ${{ secrets.ANTHROPIC_API_KEY_CHARLES_INSIGHTS }}
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Gerando relatório semanal..."
            python3 weekly_report.py
          else
            echo "Não é segunda-feira, pulando relatório semanal."
          fi

      - name: Commit and push
        run: |
          git config user.name "Charles Bot"
          git config user.email "charles@charlapodcast.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: update $(date +'%Y-%m-%d')"
          git push
